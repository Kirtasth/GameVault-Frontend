server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /images/ {
        proxy_pass http://minio:9000/gamevault-bucket/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass all headers and do not modify body
        proxy_pass_request_headers on;
        proxy_pass_request_body on;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 0;

        # Optional: Add caching so images load lightning fast
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /api/ {
        # 'backend' is the exact service name from your docker-compose.yml
        proxy_pass http://backend:8080/api/;

        # Pass essential headers so Spring Boot knows where the request actually came from
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass all headers and do not modify body
        proxy_pass_request_headers on;
        proxy_pass_request_body on;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 0;
    }

    # Optional: Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webmanifest)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
