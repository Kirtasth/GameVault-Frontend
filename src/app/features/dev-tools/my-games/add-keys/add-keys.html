<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm animate-fade-in">
  <div class="bg-peacock-dark border border-white/10 rounded-2xl w-full max-w-md p-8 shadow-2xl animate-scale-in">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-2xl font-bold text-peacock-teal">Add Keys</h2>
      <button (click)="onCancel()" class="text-gray-400 hover:text-white transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="mb-6">
      <p class="text-gray-400 text-sm mb-2">Game:</p>
      <h3 class="text-white text-lg font-semibold">{{ game().title }}</h3>
    </div>

    <form [formGroup]="keysForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label for="keys" class="block text-sm font-medium text-gray-300 mb-2">
          Paste keys below (one per line)
        </label>
        <textarea
          id="keys"
          formControlName="keys"
          rows="10"
          placeholder="XXXXX-XXXXX-XXXXX
YYYYY-YYYYY-YYYYY"
          class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-peacock-teal focus:ring-1 focus:ring-peacock-teal transition-all resize-none"
        ></textarea>
        <p class="mt-2 text-xs text-gray-500">
          Tip: Each line will be treated as a single game key.
        </p>
      </div>

      @if (errorMessage()) {
        <div class="p-3 bg-red-500/10 border border-red-500/20 rounded-lg">
          <p class="text-red-400 text-sm text-center">{{ errorMessage() }}</p>
        </div>
      }

      <div class="flex gap-4 pt-2">
        <button
          type="button"
          (click)="onCancel()"
          class="flex-1 px-6 py-3 border border-white/10 text-white rounded-xl font-semibold hover:bg-white/5 transition-all"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="keysForm.invalid || isSubmitting()"
          class="flex-1 px-6 py-3 bg-peacock-teal text-white rounded-xl font-semibold hover:bg-peacock-teal/90 disabled:opacity-50 disabled:cursor-not-allowed transition-all relative overflow-hidden group"
        >
          @if (isSubmitting()) {
            <span class="flex items-center justify-center gap-2">
              <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Processing...
            </span>
          } @else {
            Add Keys
          }
        </button>
      </div>
    </form>
  </div>
</div>
