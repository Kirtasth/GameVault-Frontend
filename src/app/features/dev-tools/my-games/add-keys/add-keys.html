<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
  <div class="bg-peacock-dark border border-white/10 w-full max-w-lg rounded-2xl p-6 shadow-2xl animate-scale-in">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-xl font-bold text-white">Add Game Keys: {{ game().title }}</h2>
      <button appDebounceClick (debounceClick)="onCancel()" class="text-gray-400 hover:text-white transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    @if (errorMessage()) {
      <div class="mb-6 p-3 bg-red-500/10 border border-red-500/20 rounded-lg text-red-400 text-sm">
        {{ errorMessage() }}
      </div>
    }

    <form [formGroup]="keysForm" (ngSubmit)="onSubmit()">
      <div class="mb-6">
        <label for="keys" class="block text-sm font-medium text-gray-400 mb-2">Game Keys (one per line)</label>
        <textarea
          id="keys"
          formControlName="keys"
          rows="10"
          class="w-full bg-white/5 border border-white/10 rounded-xl p-4 text-white font-mono text-sm focus:ring-2 focus:ring-peacock-teal/50 focus:border-peacock-teal transition-all outline-none resize-none"
          placeholder="XXXXX-XXXXX-XXXXX-XXXXX&#10;YYYYY-YYYYY-YYYYY-YYYYY"
        ></textarea>
        @if (keysForm.get('keys')?.invalid && keysForm.get('keys')?.touched) {
          <p class="text-red-400 text-xs mt-2">Please enter valid keys (alphanumeric and dashes only).</p>
        }
      </div>

      <div class="flex justify-end gap-3">
        <button
          appDebounceClick
          type="button"
          (debounceClick)="onCancel()"
          class="px-4 py-2 text-gray-300 hover:text-white transition-colors"
        >
          Cancel
        </button>
        <button
          appDebounceClick
          type="submit"
          [disabled]="keysForm.invalid || isSubmitting()"
          class="px-6 py-2 bg-peacock-teal hover:bg-peacock-teal/80 text-white font-bold rounded-lg shadow-lg disabled:opacity-50 disabled:cursor-not-allowed transition-all flex items-center gap-2"
        >
          @if (isSubmitting()) {
            <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Adding...
          } @else {
            Add Keys
          }
        </button>
      </div>
    </form>
  </div>
</div>
