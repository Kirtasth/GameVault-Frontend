<div class="fixed bottom-0 right-0 m-4 z-50 flex flex-col items-end gap-2">
  <!-- Info Box -->
  @if (isOpen()) {
    <div class="bg-peacock-dark border-2 border-peacock-teal text-white p-4 rounded-lg shadow-xl w-64 animate-fade-in mb-2"
         role="alert">
      <div class="flex justify-between items-start mb-2">
        <p class="font-bold text-peacock-teal">Developer Notice</p>
        <button (click)="toggle()" class="text-white hover:text-peacock-teal transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
          </svg>
        </button>
      </div>
      <p class="text-sm">Page still under development.
        <br> - Users may be deleted.
        <br> - Cart items may be deleted.
        <br> - Uploaded images may be deleted.
      </p>
    </div>
  }

  <!-- Toggle Button -->
  <button (click)="toggle()"
          [title]="isOpen() ? 'Close info' : 'View developer info'"
          class="bg-peacock-teal hover:bg-peacock-emerald text-peacock-dark p-3 rounded-full shadow-lg transition-all transform hover:scale-110 active:scale-95 flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-peacock-purple">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
      <path d="M8 1a7 7 0 1 1 0 14A7 7 0 0 1 8 1zm.93 8.588-2.29.287-.082.38.45.083c.294.07.352.176.288.469l-.738 3.468c-.194.897.105 1.319.808 1.319.545 0 1.178-.252 1.465-.598l.088-.416c-.2.176-.492.246-.686.246-.275 0-.375-.193-.304-.533L8.93 9.588zM9 4.5a1 1 0 1 1-2 0 1 1 0 0 1 2 0z"/>
    </svg>
  </button>
</div>
