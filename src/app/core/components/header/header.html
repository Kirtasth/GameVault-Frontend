<header class="h-16 bg-white/5 border-b border-white/10 flex items-center justify-between px-4 lg:hidden sticky top-0 z-50 backdrop-blur-md">
  <div class="flex items-center gap-3">
    <button (click)="toggleSidebar()"
            class="text-gray-400 hover:text-white focus:outline-none p-2 rounded-md hover:bg-white/10 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
    <a routerLink="/" class="flex items-center gap-2 shrink-0">
      <img src="assets/images/game_vault_logo.svg" alt="GameVault Logo" class="h-8 w-8 shrink-0">
      <span class="text-white font-bold text-lg tracking-tight whitespace-nowrap">GameVault</span>
    </a>
  </div>

  <div class="flex items-center gap-2">
    <!-- Optional: Add search or cart icon here for mobile -->
  </div>
</header>
